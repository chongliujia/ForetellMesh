[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foretellmesh"
version = "0.1.0"
description = "Reproducible financial event forecasting research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
graph = ["langgraph==1.2.11"]

[project.scripts]
foretellmesh = "foretellmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
